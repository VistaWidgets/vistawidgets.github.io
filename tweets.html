<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Vastina's Archive</title>
        <link href="style.css" rel="stylesheet" type="text/css" media="all">
        <link rel="icon" href="assets/logos/logo.ico">
        <style>

        </style>
    </head>
    <body onload="loadPage('tweets')">
        <!-- Emojis courtesy of Twemoji, used under the CC-BY-4.0 license -->
        <!-- https://github.com/twitter/twemoji -->
        <template id="template_tweet">
            <article class="tweet">
                <a class="avatar">
                    <img src="assets/profiles/vastina.jpg">
                </a>
                <header>
                    <a href="https://x.com/vistawidgets"> <!-- source -->
                        <b></b> <!-- name -->
                        <span></span> <!-- handle -->
                    </a>
                </header>
                <main>
                    <div class="text">
                        <span></span> <!-- text -->
                    </div>
                    <div class="media one"> <!-- media -->
                    </div>
                    <div class="decoratives">
                        <button></button>
                        <button></button>
                        <button></button>
                        <button></button>
                    </div>
                    <span class="time">
                        <!-- time -->
                    </span>
                </main>
            </article>
        </template>
        <div id="all" style="max-height: 900px;">
            <section id="content" class="window">
                <header class="decoratives">
                    <div class="buttons">
                        <button>_</button>
                        <button>☐</button>
                        <button>X</button>
                    </div>
                    <div class="searchbar">
                        <div>
                            <button style="margin-right: calc(var(--gap) * 0.4);"></button> <!-- Buttons are non-functional but I'm writing them like this incase I want to make them do something later -D-->
                            <button></button>
                            <span>▾</span>
                        </div>
                        <label>
                            <img src="assets/getting_started.ico">
                            <span>«</span>Vastina Archive <span>▸</span> Tweets
                        </label>
                        <label>
                            <img src="assets/arrows.ico">
                        </label>
                        <label><i>Search</i><img src="assets/search.ico"></label>
                    </div>
                </header>
                <main class="tweets">
                    <div class="menu">
                        <div>
                            <label>Eras (select one):</label>
                            <select id="arcSelect">
                                <option value="win7" selected>Windows 7</option>
                                <option value="winvista">Windows Vista</option>
                                <option value="bunkerbots">Bunkerbots Collab</option>
                            </select>
                            <label>Description:</label>
                            <span id="description">
                                
                            </span>
                        </div>
                    </div>
                    <div class="twitter" id="twt">
                    </div>
                </main>
            </section>
        </div>
    </body>
    <script src="archive/archive.js"></script>
</html>
